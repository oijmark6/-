<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>만보기 실시간 순위표</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #4f6cff, #6a5cff);
    color: white;
}

.container {
    width: 800px;
    margin: 40px auto;
}

.latest {
    background: #fff;
    color: #333;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
}

.title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.card {
    background: #fff;
    color: #333;
    border-radius: 15px;
    padding: 15px;
    height: 400px;
    overflow-y: auto;
}

.row {
    display: flex;
    align-items: center;
    margin: 8px 0;
    padding: 8px;
    border-radius: 10px;
}

.top {
    background: linear-gradient(90deg, gold, orange);
    color: #000;
    font-weight: bold;
}

.rank { width: 70px; }
.name { width: 120px; }

.bar-container {
    flex: 1;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin-right: 10px;
}

.bar {
    height: 20px;
    background: linear-gradient(90deg, #b06cff, #8f5cff);
}

.score {
    width: 140px;
    text-align: right;
}

.firework {
    position: fixed;
    top: 50%;
    left: 50%;
    font-size: 40px;
    animation: explode 1s forwards;
}

@keyframes explode {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
}

button {
    padding: 8px 12px;
    margin: 5px;
    background: #6a5cff;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">

<div class="latest" id="latestBox">최근 전적: 없음</div>

<div class="title">🚶 만보기 실시간 순위표</div>

<button onclick="enableSound()">🔊 사운드 켜기</button>
<button onclick="toggleFullscreen()">📺 전체화면</button>

<br><br>

<input id="nameInput" placeholder="이름">
<input id="stepInput" type="number" placeholder="걸음 수">
<button onclick="addData()">추가</button>

<div class="card" id="rankList"></div>

</div>

<script>
let data = [];
let latest = null;
let prevTop = null;

// 🔊 Web Audio API
let audioCtx = null;
let soundEnabled = false;

const soundFiles = [
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b7dbe.mp3",
    "https://cdn.pixabay.com/download/audio/2022/03/10/audio_270d98c7e8.mp3",
    "https://cdn.pixabay.com/download/audio/2021/08/04/audio_884fe92c94.mp3"
];

function enableSound(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    soundEnabled = true;
    alert("🔊 사운드 활성화됨!");
}

async function playSound(){
    if(!soundEnabled) return;

    const url = soundFiles[Math.floor(Math.random()*soundFiles.length)];
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(buf);

    const src = audioCtx.createBufferSource();
    src.buffer = audioBuffer;
    src.connect(audioCtx.destination);
    src.start(0);
}

function showFirework(){
    const fw = document.createElement("div");
    fw.className = "firework";
    fw.innerText = "🎆";
    document.body.appendChild(fw);

    playSound();

    setTimeout(()=>fw.remove(),1000);
}

function toggleFullscreen(){
    if (!document.fullscreenElement)
        document.documentElement.requestFullscreen();
    else document.exitFullscreen();
}

// ⭐ ID 기반 추가
function addData(){
    const name = nameInput.value.trim();
    const steps = parseInt(stepInput.value);

    if(!name || isNaN(steps)) return;

    const newItem = {
        id: Date.now() + Math.random(), // 고유 ID
        name: name,
        steps: steps
    };

    data.push(newItem);
    latest = newItem;

    nameInput.value = "";
    stepInput.value = "";

    render();
}

// ⭐ ID로 삭제
function deleteData(id){
    data = data.filter(d => d.id !== id);
    render();
}

function render(){
    const box = document.getElementById("rankList");
    box.innerHTML = "";

    data.sort((a,b)=>b.steps-a.steps);

    if(prevTop && data[0] && prevTop !== data[0].id){
        showFirework();
    }

    if(data[0]) prevTop = data[0].id;

    data.forEach((d,i)=>{
        const div = document.createElement("div");
        div.className = "row"+(i==0?" top":"");

        const percent = ((i+1)/data.length*100).toFixed(0);

        div.innerHTML = `
            <div class="rank">${i+1}</div>
            <div class="name">${d.name}</div>
            <div class="bar-container">
                <div class="bar" style="width:${(d.steps/data[0].steps)*100}%"></div>
            </div>
            <div class="score">
                ${d.steps}걸음<br>
                상위 ${percent}%
            </div>
            <button onclick="deleteData('${d.id}')">❌</button>
        `;

        box.appendChild(div);
    });

    if(latest){
        const rank = data.findIndex(d=>d.id===latest.id)+1;
        const percent = ((rank/data.length)*100).toFixed(0);

        latestBox.innerText =
            `최근 전적: ${latest.name} (${latest.steps}) → ${rank}위 / 상위 ${percent}%`;
    }
}
</script>

</body>
</html>
